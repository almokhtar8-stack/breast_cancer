# Candidate adjudication: deep inspection of the actual evidence behind
# the genome-wide integration above, for the seven MULTIMODAL_STRONG
# genes and beyond. Purely additive over cross_dataset_genomewide's
# already-frozen outputs -- reads them read-only, writes nothing back
# into that directory. No pathway/druggability/literature analysis.
candidate_adjudication:
  output:
    tables_dir: results/tables/candidate_adjudication
    figures_dir: results/figures/candidate_adjudication
    final_review_dir: results/figures/candidate_adjudication/final_review
    sample_level_dir: results/figures/candidate_adjudication/sample_level
    gene_cards_dir: results/figures/candidate_adjudication/gene_cards
  multimodal7:
    genes: [USP34, VEZF1, CUX1, DPP9, LZTR1, SOX2, TFAP2C]

# Evidence freeze: final evidence-layer cleanup/presentation pass over the
# already-frozen candidate-adjudication outputs above. Purely additive --
# reads candidate_adjudication's tables read-only, writes nothing back
# into that directory. No pathway/druggability/literature/normal-tissue
# information is used to decide the frozen shortlist.
evidence_freeze:
  output:
    tables_dir: results/tables/evidence_freeze
    figures_dir: results/figures/evidence_freeze
    final_review_dir: results/figures/evidence_freeze/final_review
