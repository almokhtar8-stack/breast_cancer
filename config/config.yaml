data:
  raw:
    hany_data_s1: /ibex/scratch/aljaroaa/tamoxifen-data/hany/add3685_Data_S1.txt
    ceg2_supplementary_archive: /ibex/scratch/aljaroaa/tamoxifen-data/ceg2/hart2017_g3_supplementary.zip
    gse118713_transcript_tpm: /ibex/scratch/aljaroaa/tamoxifen-data/rnaseq/GSE118713_TRANSCRIPT_TAMR_FASR_MCF7_expression_data.tsv.gz
    gse111151_sample_dir: /ibex/scratch/aljaroaa/tamoxifen-data/rnaseq/GSE111151
  reference:
    ceg2_gene_list: data/reference/hart2017_ceg2_684.tsv
  processed_dir: data/processed
  results_tables_dir: results/tables
  qc_tables_dir: results/tables

# GSE118713: MCF7 parental / TAMR / FASR, transcript-level TPM, n=3 per group.
# See PREANALYSIS.md's 2026-08-05 Phase 2 data-audit amendment: gene-level
# TPM is calculated by summing transcript TPM within each of these nine
# replicate columns by unversioned Ensembl gene ID; the group-mean columns
# below are never read as sample data.
gse118713:
  output:
    gene_tpm_parquet: data/processed/gse118713_gene_tpm.parquet
    sample_metadata_tsv: results/tables/gse118713_sample_metadata.tsv
    qc_tsv: results/tables/gse118713_preparation_qc.tsv
  samples:
    - {column: Rep1.MCF7.TPM, sample_id: MCF7_Rep1, group: MCF7, replicate: 1}
    - {column: Rep2.MCF7.TPM, sample_id: MCF7_Rep2, group: MCF7, replicate: 2}
    - {column: Rep3.MCF7.TPM, sample_id: MCF7_Rep3, group: MCF7, replicate: 3}
    - {column: Rep1.TAMR.TPM, sample_id: TAMR_Rep1, group: TAMR, replicate: 1}
    - {column: Rep2.TAMR.TPM, sample_id: TAMR_Rep2, group: TAMR, replicate: 2}
    - {column: Rep3.TAMR.TPM, sample_id: TAMR_Rep3, group: TAMR, replicate: 3}
    - {column: Rep1.FASR.TPM, sample_id: FASR_Rep1, group: FASR, replicate: 1}
    - {column: Rep2.FASR.TPM, sample_id: FASR_Rep2, group: FASR, replicate: 2}
    - {column: Rep3.FASR.TPM, sample_id: FASR_Rep3, group: FASR, replicate: 3}
  excluded_mean_columns: [MCF7.mean.TPM, TAMR.mean.TPM, FASR.mean.TPM]
  frozen_gene_tpm_sha256: 82e9d8c0a6eb7eded61463963e00f36515825aeb25c04775db977389d8b26bb9

# Phase 2B: QC and limma differential expression on the frozen GSE118713
# gene-level TPM matrix. See PREANALYSIS.md's 2026-08-05 Phase 2B
# statistical-plan amendment for the full preregistered rule set.
gse118713_phase2b:
  expected_n_genes: 60155
  expected_n_samples: 9
  expected_groups: [MCF7, TAMR, FASR]
  expected_replicates_per_group: 3
  filtering:
    min_tpm: 1.0
    min_samples: 3
    filtered_gene_tpm_tsv: data/processed/gse118713_gene_tpm_filtered.tsv.gz
    frozen_filtered_gene_tpm_sha256: 5898febf286f39838f3b69b7e578de03b1c6a049c5d4375e72adcd29cc0ea152
    filtering_summary_tsv: results/tables/gse118713_expression_filtering.tsv
  qc:
    n_pca_genes: 2000
    sample_qc_tsv: results/tables/gse118713_sample_qc.tsv
    sample_correlations_tsv: results/tables/gse118713_sample_correlations.tsv
    pca_coordinates_tsv: results/tables/gse118713_pca_coordinates.tsv
    pca_figure_pdf: results/figures/gse118713_pca.pdf
    correlation_figure_pdf: results/figures/gse118713_sample_correlation.pdf
  limma:
    script: scripts/analysis/gse118713_limma.R
    contrasts: [TAMR_vs_MCF7, FASR_vs_MCF7, TAMR_vs_FASR]
    differential_expression_tsv_gz: results/tables/gse118713_differential_expression.tsv.gz
  specificity:
    output_tsv_gz: results/tables/gse118713_tamr_specificity.tsv.gz
  summary:
    output_tsv: results/tables/gse118713_de_summary.tsv
  # Preregistered blind positive controls (PREANALYSIS.md S5; CLAUDE.md hard
  # rule). Held out of every generated result table until the model is
  # frozen: fit on the full gene set like every other gene, then withheld at
  # the reporting stage only, after all statistics/FDR are finalized.
  blinding:
    blinded_gene_ids: [ENSG00000089902, ENSG00000004487]  # RCOR1, KDM1A
    redaction_record_tsv: results/tables/gse118713_blinding_redaction.tsv
  # Controlled unredaction (PREANALYSIS.md's 2026-08-10 provenance-correction
  # amendment): reruns gse118713_limma.R on the exact same frozen inputs
  # (filtered TPM matrix, sample metadata, script) with blinded_gene_ids
  # explicitly empty -- only the export-stage redaction is disabled, no
  # modelling/filtering/statistical choice changes. Writes a separate,
  # versioned derivative rather than overwriting the redacted outputs above.
  unredaction:
    differential_expression_unredacted_tsv_gz: results/tables/gse118713_differential_expression_unredacted.tsv.gz
    frozen_differential_expression_unredacted_sha256: ff174187764b9e281c507b2a5e3b83c1d97941aa201d4868f805e46496462abe
    redaction_record_unredacted_tsv: results/tables/gse118713_blinding_redaction_unredacted.tsv
    specificity_unredacted_tsv_gz: results/tables/gse118713_tamr_specificity_unredacted.tsv.gz
    frozen_specificity_unredacted_sha256: f88c0767ba97277c97994cda30866a1e602a0c17d6ab73b890a63963ff982cf2
    comparison_tsv: results/tables/gse118713_unredaction_comparison.tsv

# GSE111151: 4 parental lines, 7 TamR derivatives, n=1 per sample (no
# biological replicates). Tam1/Tam2 are distinct resistant derivative
# clones of the same parental line, not replicates of one derivative -- see
# PREANALYSIS.md's 2026-08-05 Phase 2 data-audit amendment. This table is
# the single source of sample/pairing metadata; loader code must not
# re-derive it from filenames.
gse111151:
  output:
    log2cpm_parquet: data/processed/gse111151_log2cpm.parquet
    sample_metadata_tsv: results/tables/gse111151_sample_metadata.tsv
    qc_tsv: results/tables/gse111151_preparation_qc.tsv
  samples:
    - {gsm: GSM3024053, filename: GSM3024053_MCF-7.txt.gz, sample_id: MCF-7, parental_line: MCF-7, status: parental, derivative_id: null, paired_parental_sample_id: null}
    - {gsm: GSM3024054, filename: GSM3024054_MCF-7_Tam1.txt.gz, sample_id: MCF-7_Tam1, parental_line: MCF-7, status: resistant, derivative_id: Tam1, paired_parental_sample_id: MCF-7}
    - {gsm: GSM3024055, filename: GSM3024055_T-47D.txt.gz, sample_id: T-47D, parental_line: T-47D, status: parental, derivative_id: null, paired_parental_sample_id: null}
    - {gsm: GSM3024056, filename: GSM3024056_T-47D_Tam1.txt.gz, sample_id: T-47D_Tam1, parental_line: T-47D, status: resistant, derivative_id: Tam1, paired_parental_sample_id: T-47D}
    - {gsm: GSM3024057, filename: GSM3024057_T-47D_Tam2.txt.gz, sample_id: T-47D_Tam2, parental_line: T-47D, status: resistant, derivative_id: Tam2, paired_parental_sample_id: T-47D}
    - {gsm: GSM3024058, filename: GSM3024058_ZR-75-1.txt.gz, sample_id: ZR-75-1, parental_line: ZR-75-1, status: parental, derivative_id: null, paired_parental_sample_id: null}
    - {gsm: GSM3024059, filename: GSM3024059_ZR-75-1_Tam1.txt.gz, sample_id: ZR-75-1_Tam1, parental_line: ZR-75-1, status: resistant, derivative_id: Tam1, paired_parental_sample_id: ZR-75-1}
    - {gsm: GSM3024060, filename: GSM3024060_ZR-75-1_Tam2.txt.gz, sample_id: ZR-75-1_Tam2, parental_line: ZR-75-1, status: resistant, derivative_id: Tam2, paired_parental_sample_id: ZR-75-1}
    - {gsm: GSM3024061, filename: GSM3024061_BT-474.txt.gz, sample_id: BT-474, parental_line: BT-474, status: parental, derivative_id: null, paired_parental_sample_id: null}
    - {gsm: GSM3024062, filename: GSM3024062_BT-474_Tam1.txt.gz, sample_id: BT-474_Tam1, parental_line: BT-474, status: resistant, derivative_id: Tam1, paired_parental_sample_id: BT-474}
    - {gsm: GSM3024063, filename: GSM3024063_BT-474_Tam2.txt.gz, sample_id: BT-474_Tam2, parental_line: BT-474, status: resistant, derivative_id: Tam2, paired_parental_sample_id: BT-474}

gate1:
  labels_path: data/processed/labels.parquet
  frozen_labels_sha256: f296505647262a01dc8728ea82ff1a8e7b8984906bcb242d4704dc105faaa3a0
  fdr_threshold: 0.1
  n_fitted_genes_expected: 19103
  branch_thresholds:
    classifier_min: 30
    continuous_min: 10
  decision_output: results/tables/gate1_decision.tsv
  essentiality:
    tested_set_size: 50
    output: results/tables/gate1_essentiality_summary.tsv
  direction_sanity:
    genes: [PIK3CA, AKT1, ESR1, MAP2K1, ERBB2, RB1, TP53]
    output: results/tables/gate1_direction_sanity.tsv

# Poster-pivot master integration table (PREANALYSIS.md 2026-08-10
# amendment): joins the Gate-1 FDR<0.1 CRISPR hits above to GSE118713
# resistance expression. Reads labels/GSE118713 paths from the gate1,
# gse118713, and gse118713_phase2b sections above; no raw paths duplicated
# here.
crispr_gse118713_integration:
  expected_n_hits: 28
  output:
    master_table_tsv: results/tables/crispr_gse118713_master_table.tsv
    master_table_csv: results/tables/crispr_gse118713_master_table.csv
    master_table_parquet: results/tables/crispr_gse118713_master_table.parquet
    qc_summary_tsv: results/tables/crispr_gse118713_integration_qc.tsv
    qc_summary_md: results/tables/crispr_gse118713_integration_qc.md

# Candidate-prioritisation evidence summary/tiering (descriptive only, no
# composite score). Reads the frozen master table above; no CRISPR/limma
# recomputation.
candidate_evidence_summary:
  rna_significance_fdr: 0.05
  output:
    evidence_summary_tsv: results/tables/candidate_evidence_summary.tsv
    sensitisation_candidates_tsv: results/tables/candidate_sensitisation_candidates.tsv
    tolerance_hits_tsv: results/tables/candidate_tolerance_hits.tsv
    shortlist_tsv: results/tables/candidate_shortlist.tsv
    secondary_candidates_tsv: results/tables/candidate_secondary_context.tsv
    paics_benchmark_tsv: results/tables/candidate_paics_benchmark.tsv
    plot_crispr_effects_tsv: results/tables/plot_input_crispr_effects.tsv
    plot_gse118713_contrasts_tsv: results/tables/plot_input_gse118713_contrasts.tsv
    plot_shortlist_matrix_tsv: results/tables/plot_input_shortlist_matrix.tsv

# NEBULA poster figures (candidate-prioritisation phase). Plotting only --
# reads exclusively the frozen tables written by
# src.candidate_evidence_summary, src.gse118713_qc, the frozen limma
# differential-expression table, and the checksum-pinned filtered GSE118713
# TPM matrix. No CRISPR/limma/PCA/candidate recomputation.
nebula_plots:
  output_dir: results/figures/nebula
  plot_input_dir: results/tables/nebula_plot_inputs
  rna_significance_fdr: 0.05
  qc:
    expected_n_hits: 28
    expected_n_sensitising: 13
    expected_n_tolerance: 15
    expected_n_samples: 9
    expected_primary_gene: USP34
  style:
    poster_background: "#0B0B12"
    panel_background: "#F8FAFC"
    palette:
      nebula_purple: "#6E44FF"
      soft_lilac: "#B799FF"
      cosmic_magenta: "#D946EF"
      rose_pink: "#F472B6"
      neutral_grey: "#94A3B8"
    group_colors:
      MCF7: "#B799FF"
      TAMR: "#6E44FF"
      FASR: "#F472B6"
    direction_colors:
      sensitising_knockout: "#6E44FF"
      tolerance_associated_knockout: "#F472B6"
  figures:
    crispr_landscape:
      png: results/figures/nebula/fig1_crispr_hit_landscape.png
      png_transparent: results/figures/nebula/fig1_crispr_hit_landscape_transparent.png
      pdf: results/figures/nebula/fig1_crispr_hit_landscape.pdf
      plot_input_tsv: results/tables/nebula_plot_inputs/fig1_crispr_hit_landscape_input.tsv
      paics_inset_tsv: results/tables/nebula_plot_inputs/fig1_paics_inset_input.tsv
    pca:
      png: results/figures/nebula/fig2_gse118713_pca.png
      png_transparent: results/figures/nebula/fig2_gse118713_pca_transparent.png
      pdf: results/figures/nebula/fig2_gse118713_pca.pdf
      plot_input_tsv: results/tables/nebula_plot_inputs/fig2_gse118713_pca_input.tsv
    volcano:
      png: results/figures/nebula/fig3_tamr_vs_mcf7_volcano.png
      png_transparent: results/figures/nebula/fig3_tamr_vs_mcf7_volcano_transparent.png
      pdf: results/figures/nebula/fig3_tamr_vs_mcf7_volcano.pdf
      plot_input_tsv: results/tables/nebula_plot_inputs/fig3_tamr_vs_mcf7_volcano_input.tsv
    evidence_matrix:
      png: results/figures/nebula/fig4_sensitising_evidence_matrix.png
      png_transparent: results/figures/nebula/fig4_sensitising_evidence_matrix_transparent.png
      pdf: results/figures/nebula/fig4_sensitising_evidence_matrix.pdf
      plot_input_tsv: results/tables/nebula_plot_inputs/fig4_sensitising_evidence_matrix_input.tsv
    usp34_panel:
      png: results/figures/nebula/fig5_usp34_panel.png
      png_transparent: results/figures/nebula/fig5_usp34_panel_transparent.png
      pdf: results/figures/nebula/fig5_usp34_panel.pdf
